name: One-time LINE quota check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-line-quota.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read LINE quota from production
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --show-error --silent --max-time 30 https://case-myp.vercel.app/api/line-quota-check-7f29)"
          echo "$body"
          RESULT="$body" python - <<'PY'
          import json, os
          d=json.loads(os.environ["RESULT"])
          assert d.get("success") is True, d
          print("QUOTA_CHECK_OK")
          print("limit=",d.get("limit"))
          print("used=",d.get("used"))
          print("remaining=",d.get("remaining"))
          print("quotaType=",d.get("quotaType"))
          PY
