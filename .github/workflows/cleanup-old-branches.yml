name: Cleanup old branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete retired branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
          "agent/facebook-dark-design-refresh"
          "agent/impeccable-stability-audit"
          "agent/remove-assignment-nav"
          "agent/stability-audit"
          "agent/unify-standalone-case-pages"
          "cleanup/remove-dead-code-20260926"
          "feat/admin-line-toggle-20260924"
          "feat/edit-all-case-details-20260925"
          "feat/initial-case-note-20260925"
          "feat/line-new-case-alert-20260924"
          "feat/line-qr-image-20260924"
          "feat/mobile-one-line-status-cards-20260924"
          "fix/ios-admin-topbar-safe-area-20260924"
          "fix/line-import-complete-batch-20260924"
          "fix/line-import-function-init-20260924"
          "fix/mobile-case-cards-final-20260924"
          "fix/mobile-cases-compact-search-20260924"
          "fix/mobile-current-cases-cleanup-20260924"
          "fix/team-hq-followups-20260924"
          "ops/import-line-cases-2609026-2609121"
          "ops/import-line-cases-2609026-20260924"
          "ops/remove-line-import-endpoint-20260924"
          "ops/run-line-import-2609"
          "refactor/remove-umhome-summary-link"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          echo "Cleanup completed."
